name: Kursdaten-Archiv aktualisieren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/daten.yml']
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: kursdaten
  cancel-in-progress: false
jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Downloader installieren
        run: npm install --no-save --no-package-lock dukascopy-node@1
      - name: Kurse laden
        env:
          BUDGET_MIN: '270'
        run: node tools/fetch-data.mjs
      - name: Speichern
        run: |
          git config user.name "kursdaten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Keine neuen Daten."; exit 0; fi
          git commit -q -m "Kursdaten aktualisiert"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
