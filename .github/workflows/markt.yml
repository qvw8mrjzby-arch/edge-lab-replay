name: Marktdaten für Jarvis aktualisieren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch-markets.mjs', '.github/workflows/markt.yml']
  schedule:
    - cron: '41 * * * 1-5'
    - cron: '41 */4 * * 0,6'
permissions:
  contents: write
concurrency:
  group: marktdaten
  cancel-in-progress: false
jobs:
  markt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Marktdaten, News und Termine laden
        run: node tools/fetch-markets.mjs
      - name: Speichern
        run: |
          git config user.name "kursdaten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets data/news.json data/calendar.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -q -m "Marktdaten aktualisiert"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 7; done
          exit 1
